<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Talentry</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f3ff;--surface:#fff;--ink:#1a1240;--mute:#5f5885;--line:#e2dbff;--acc:#5b21ff;--acc2:#ff3d8b;--acc3:#ffb800;--acc-t:#fff;--ok:#058a5e;--ok-bg:#d3f8e6;--warn-bg:#efe9ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12142a;--surface:#1c1f3d;--ink:#eef0ff;--mute:#a4abcc;--line:#2e3260;--acc:#8b86ff;--acc-t:#12142a;--ok:#4fdcaa;--ok-bg:#12382f;--warn-bg:#262a52}}
:root[data-theme="dark"]{--bg:#12142a;--surface:#1c1f3d;--ink:#eef0ff;--mute:#a4abcc;--line:#2e3260;--acc:#8b86ff;--acc-t:#12142a;--ok:#4fdcaa;--ok-bg:#12382f;--warn-bg:#262a52}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 92% -8%,rgba(255,61,139,.22),transparent 42%),radial-gradient(circle at -8% 18%,rgba(91,33,255,.18),transparent 42%),var(--bg);background-attachment:fixed;color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,sans-serif;line-height:1.5}
button,input,select{font:inherit;color:inherit}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.logo{font-weight:800;font-size:22px;letter-spacing:-.5px;cursor:pointer;display:flex;align-items:center;gap:8px}
.logo i{width:28px;height:28px;border-radius:9px 9px 9px 2px;background:linear-gradient(135deg,#5b21ff,#ff3d8b);display:inline-block}
main{max-width:1000px;margin:0 auto;padding:28px 20px 60px}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:10px;cursor:pointer;font-weight:700}
.btn:hover{border-color:var(--acc)}
.btn.p{background:linear-gradient(135deg,#6d3bff,#ff3d8b);color:#fff;border-color:transparent;box-shadow:0 6px 16px -6px rgba(255,61,139,.7)}.btn.p:hover{filter:brightness(1.1)}.hot{background:linear-gradient(135deg,#5b21ff,#9a5cff);color:#fff;border:0}.hot2{background:linear-gradient(135deg,#ff3d8b,#ff8a3d);color:#fff;border:0}.hot .mute,.hot2 .mute{color:rgba(255,255,255,.92)}
.btn.s{padding:5px 11px;font-size:13px}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.hero{padding:56px 0 36px;max-width:680px}
h1{font-size:clamp(36px,6.5vw,62px);line-height:1.05;letter-spacing:-1.5px;margin:0 0 16px;font-weight:800;background:linear-gradient(100deg,var(--ink) 25%,var(--acc) 65%,var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{margin:0 0 6px;font-size:24px;letter-spacing:-.5px}
h3{margin:0 0 10px;font-size:17px}
.lead{color:var(--mute);font-size:18px;margin:0 0 26px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 10px 24px -14px rgba(91,33,255,.45)}.grid .card:nth-child(3n+1){border-top:5px solid var(--acc)}.grid .card:nth-child(3n+2){border-top:5px solid var(--acc2)}.grid .card:nth-child(3n){border-top:5px solid var(--acc3)}
.card.link{cursor:pointer}.card.link:hover{border-color:var(--acc)}
.tag{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;background:var(--warn-bg);font-size:13px;font-weight:500;margin:0 6px 6px 0}
.tag.ok{background:var(--ok-bg);color:var(--ok);font-weight:700}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.mute{color:var(--mute);font-size:14px}
label{display:block;font-weight:700;font-size:14px;margin:12px 0 5px}
input,select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.tabs{display:flex;gap:6px;margin-bottom:6px}
.tabs button{flex:1}
.tabs .on{background:var(--acc);color:var(--acc-t);border-color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px;margin-top:16px}
.ava{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#5b21ff,#ff3d8b);display:grid;place-items:center;font-weight:800;color:#fff}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.bar>*{flex:1;min-width:160px}
.note{background:var(--warn-bg);border-left:5px solid var(--acc2);border-radius:10px;padding:12px 16px;font-size:14px;margin-top:14px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:10px;font-weight:700;z-index:20;max-width:90%}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);max-width:420px;width:92%;padding:22px}
dialog::backdrop{background:rgba(10,12,30,.55)}
@media(max-width:700px){.two{grid-template-columns:1fr}header{padding:12px 16px}}
</style>
</head>
<body>
<header><div class="logo" onclick="go('home')"><i></i>Talentry</div><div class="row" id="nav"></div></header>
<main id="app"></main>
<p class="mute" style="text-align:center;padding:0 16px 24px">Talentry · <a href="#" onclick="ownerOpen();return false">Panel del dueño</a></p><dialog id="dlg"></dialog>
<script>
var LS='talentry_v3';
var seed={students:[
{id:'s1',name:'Valeria Mendoza',age:21,gender:'Femenino',email:'valeria@demo.com',career:'Ingeniería en Sistemas',uni:'UNITEC',level:'7.º semestre',skills:[{n:'JavaScript',v:1},{n:'React',v:1},{n:'SQL',v:0},{n:'Trabajo en equipo',v:1}],certs:[{n:'Responsive Web Design',o:'freeCodeCamp',v:1},{n:'Scrum Fundamentals',o:'Scrum.org',v:0}]},
{id:'s2',name:'Carlos Reyes',age:23,gender:'Masculino',email:'carlos@demo.com',career:'Administración de Empresas',uni:'UNAH-VS',level:'Último año',skills:[{n:'Excel avanzado',v:1},{n:'Finanzas',v:1},{n:'Liderazgo',v:0}],certs:[{n:'Excel Expert',o:'Microsoft',v:1}]},
{id:'s3',name:'Daniela Ortiz',age:20,gender:'Femenino',email:'daniela@demo.com',career:'Diseño Gráfico',uni:'UNITEC',level:'5.º semestre',skills:[{n:'Figma',v:1},{n:'Adobe Illustrator',v:1},{n:'UX Research',v:0}],certs:[{n:'Google UX Design',o:'Coursera',v:1}]},
{id:'s4',name:'Luis Fernández',age:24,gender:'Masculino',email:'luis@demo.com',career:'Ingeniería Industrial',uni:'UNAH-VS',level:'Egresado',skills:[{n:'Lean Six Sigma',v:1},{n:'Python',v:1},{n:'Power BI',v:1}],certs:[{n:'Green Belt Six Sigma',o:'ASQ',v:1},{n:'Data Analytics',o:'Google',v:0}]},
{id:'s5',name:'Andrea Salinas',age:22,gender:'Femenino',email:'andrea@demo.com',career:'Mercadeo',uni:'Universidad Católica',level:'8.º semestre',skills:[{n:'SEO',v:1},{n:'Redes sociales',v:1},{n:'Copywriting',v:0}],certs:[{n:'Google Analytics 4',o:'Google',v:1}]},
{id:'s6',name:'Mario Cálix',age:25,gender:'Masculino',email:'mario@demo.com',career:'Ingeniería en Sistemas',uni:'UNITEC',level:'Egresado',skills:[{n:'Python',v:1},{n:'Node.js',v:1},{n:'AWS',v:0},{n:'SQL',v:1}],certs:[{n:'AWS Cloud Practitioner',o:'Amazon',v:0}]}],
companies:[{id:'c1',name:'Innovatech HN',email:'rh@innovatech.com'}],interests:[]};
var D,me=null,view='home',F={q:'',career:''},authRole='student',authMode='in';
function load(){try{D=JSON.parse(localStorage.getItem(LS))}catch(e){}if(!D)D=JSON.parse(JSON.stringify(seed))}
function save(){try{localStorage.setItem(LS,JSON.stringify(D))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function $(id){return document.getElementById(id)}
function toast(t){var e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(function(){e.remove()},2300)}
function go(v){view=v;render()}
function stu(){return D.students.find(function(s){return s.id===me.id})}
function nav(){var h='';if(me){h+='<span class="mute">'+esc(me.name)+' · '+(me.role==='student'?'Estudiante':'Empresa')+'</span><button class="btn s" onclick="go(\'dash\')">Mi panel</button><button class="btn s" onclick="logout()">Salir</button>'}else{h='<button class="btn s" onclick="openAuth(\'in\')">Iniciar sesión</button><button class="btn p s" onclick="openAuth(\'up\')">Crear cuenta</button>'}$('nav').innerHTML=h}
function logout(){me=null;go('home');toast('Sesión cerrada')}
function render(){nav();var a=$('app');if(view==='home'||!me){a.innerHTML=home()}else{a.innerHTML=me.role==='student'?studentView():companyView()}window.scrollTo(0,0)}
function home(){return '<section class="hero"><h1>Te contratan por lo que sabes, no por quién eres.</h1><p class="lead">Talentry conecta a estudiantes con empresas. Los estudiantes verifican sus habilidades y certificados; las empresas ven el talento sin nombre, edad ni género.</p><div class="row"><button class="btn p" onclick="openAuth(\'up\',\'student\')">Soy estudiante</button><button class="btn" onclick="openAuth(\'up\',\'company\')">Soy empresa</button></div><p class="mute" style="margin-top:14px">¿Solo quieres explorar? <a href="#" onclick="demo(\'student\');return false">Entrar como estudiante demo</a> o <a href="#" onclick="demo(\'company\');return false">como empresa demo</a>.</p></section><div class="two"><div class="card hot"><h3>Para estudiantes</h3><p class="mute">Elige tu carrera, supera retos prácticos como Excel o SolidWorks y recibe el interés de empresas.</p></div><div class="card hot2"><h3>Para empresas</h3><p class="mute">Filtra perfiles por habilidades y estudios. Sin sesgos: la identidad queda oculta.</p></div></div><div class="two"><div class="card"><h3>Planes para estudiantes</h3><p style="margin:0"><strong>US$ 4.99 al mes</strong> o US$ 39.99 al año</p><p class="mute">Cursos, exámenes, retos de empresas y chat con reclutadores.</p></div><div class="card"><h3>Tarifas para empresas</h3><p style="margin:0"><strong>US$ 10 por reto publicado</strong></p><p class="mute">Un precio simple por cada reto o prueba práctica que subas.</p></div></div>'}
function demo(r){me=r==='student'?{role:'student',id:'s1',name:'Valeria Mendoza'}:{role:'company',id:'c1',name:'Innovatech HN'};view='dash';render()}
function openAuth(m,r){authMode=m;if(r)authRole=r;authForm();$('dlg').showModal()}
function authForm(){var up=authMode==='up',st=authRole==='student';var h='<h2>'+(up?'Crear cuenta':'Iniciar sesión')+'</h2><div class="tabs"><button class="btn '+(st?'on':'')+'" onclick="authRole=\'student\';authForm()">Estudiante</button><button class="btn '+(!st?'on':'')+'" onclick="authRole=\'company\';authForm()">Empresa</button></div>';
if(up){h+='<label>'+(st?'Nombre completo':'Nombre de la empresa')+'</label><input id="a_n">';if(st){h+='<label>Edad</label><input id="a_e" type="number" min="16" max="70"><label>Género</label><select id="a_g"><option>Femenino</option><option>Masculino</option><option>Otro</option></select><label>Carrera</label><select id="a_c">'+careerOpts()+'</select><label>Universidad</label><input id="a_u"><label>Nivel</label><select id="a_l"><option>Primeros años</option><option>Años intermedios</option><option>Último año</option><option>Egresado</option></select>'}else{h+='<label>Reclutador(a) responsable</label><input id="a_rn"><label>Puesto del reclutador</label><input id="a_rp" placeholder="Ej. Coordinadora de Reclutamiento"><label>Sector</label><input id="a_s" placeholder="Ej. Manufactura textil"><label>Ciudad</label><input id="a_ci"><label>Descripción</label><input id="a_d" placeholder="Qué talento buscas">'}}
h+='<label>Correo</label><input id="a_m" type="email" autocomplete="email"><label>Contraseña</label><input id="a_p" type="password" autocomplete="'+(up?'new':'current')+'-password">'+(up?'<label>Confirmar contraseña</label><input id="a_p2" type="password" autocomplete="new-password">':'')+'<div id="a_err" class="note" style="display:none;color:var(--acc2);font-weight:700"></div><div class="row" style="margin-top:18px"><button class="btn p" onclick="doAuth()">'+(up?'Crear cuenta':'Entrar')+'</button><button class="btn" onclick="authMode=\''+(up?'in':'up')+'\';authForm()">'+(up?'Ya tengo cuenta':'Crear cuenta')+'</button><button class="btn" onclick="$(\'dlg\').close()">Cancelar</button></div><p class="mute">Cuentas de ejemplo: contraseña demo1234. Los datos se guardan solo en este navegador.</p>';$('dlg').innerHTML=h}
function doAuth(){var st=authRole==='student',m=$('a_m').value.trim().toLowerCase();if(!m){return toast('Escribe tu correo')}var list=st?D.students:D.companies;
if(authMode==='in'){var u=list.find(function(x){return x.email===m});if(!u)return toast('No encontramos esa cuenta. Crea una nueva.');me={role:authRole,id:u.id,name:u.name}}
else{var n=$('a_n').value.trim();if(!n)return toast('Escribe tu nombre');if(list.some(function(x){return x.email===m}))return toast('Ese correo ya existe');var id=(st?'s':'c')+Date.now();
if(st){var ed=parseInt($('a_e').value)||18;D.students.push({id:id,name:n,age:ed,gender:$('a_g').value,email:m,career:$('a_c').value.trim()||'Sin especificar',uni:$('a_u').value.trim()||'Sin especificar',level:'En curso',skills:[],certs:[]})}else{D.companies.push({id:id,name:n,email:m})}
save();me={role:authRole,id:id,name:n}}
$('dlg').close();view='dash';render();toast('Bienvenido, '+me.name)}
function studentView(){var s=stu();var intr=D.interests.filter(function(i){return i.sid===s.id});
var h='<h2>Hola, '+esc(s.name.split(' ')[0])+'</h2><p class="mute">'+esc(s.career)+' · '+esc(s.uni)+' · '+esc(s.level)+'</p>';
h+='<div class="note">Las empresas solo ven tu carrera, universidad, habilidades y certificados. Tu nombre, edad, género y correo se comparten solo con la empresa cuya solicitud aceptes.</div><div class="two"><div class="card"><div class="row" style="justify-content:space-between"><h3>Habilidades</h3><button class="btn s" onclick="addSkill()">Agregar</button></div>';
if(!s.skills.length)h+='<p class="mute">Aún no tienes habilidades. Agrega la primera.</p>';
s.skills.forEach(function(k,i){h+='<div class="item"><span>'+esc(k.n)+'</span>'+(k.v?'<span class="tag ok">✓ Verificada</span>':'<span><button class="btn s p" onclick="verSkill('+i+')">Verificar</button> <button class="btn s" onclick="delSkill('+i+')" aria-label="Quitar">✕</button></span>')+'</div>'});
h+='</div><div class="card"><div class="row" style="justify-content:space-between"><h3>Certificados</h3><button class="btn s" onclick="addCert()">Agregar</button></div>';
if(!s.certs.length)h+='<p class="mute">Aún no tienes certificados.</p>';
s.certs.forEach(function(c,i){h+='<div class="item"><span>'+esc(c.n)+'<br><span class="mute">'+esc(c.o)+'</span></span>'+(c.v?'<span class="tag ok">✓ Verificado</span>':'<span><button class="btn s p" onclick="verCert('+i+')">Verificar</button> <button class="btn s" onclick="delCert('+i+')" aria-label="Quitar">✕</button></span>')+'</div>'});
h+='</div></div><div class="card" style="margin-top:16px"><h3>Empresas interesadas</h3>';
if(!intr.length)h+='<p class="mute">Todavía nadie. Verifica tus habilidades para destacar.</p>';
intr.forEach(function(i){var c=D.companies.find(function(x){return x.id===i.cid});h+='<div class="item"><span>'+esc(c?c.name:'Empresa')+'</span><button class="btn s p" data-c="'+i.cid+'" onclick="openChat(this.dataset.c,me.id)">Abrir chat'+(unread(i.cid,s.id)?' ('+unread(i.cid,s.id)+')':'')+'</button></div>'});
return h+'</div>'}
function dlg(h){$('dlg').innerHTML=h;$('dlg').showModal()}
function addSkill(){dlg('<h2>Agregar habilidad</h2><label>Habilidad</label><input id="f1" placeholder="Ej. Python"><div class="row" style="margin-top:18px"><button class="btn p" onclick="saveSkill()">Guardar</button><button class="btn" onclick="$(\'dlg\').close()">Cancelar</button></div>')}
function saveSkill(){var v=$('f1').value.trim();if(!v)return toast('Escribe la habilidad');stu().skills.push({n:v,v:0});save();$('dlg').close();render();toast('Habilidad agregada')}
function delSkill(i){stu().skills.splice(i,1);save();render()}
function verSkill(i){var k=stu().skills[i];dlg('<h2>Verificar '+esc(k.n)+'</h2><p class="mute">Responde para confirmar tu nivel. ¿Cuántos meses o proyectos tienes de práctica con esta habilidad?</p><label>Meses de práctica</label><input id="f1" type="number" min="0" placeholder="Ej. 6"><div class="row" style="margin-top:18px"><button class="btn p" onclick="doVerSkill('+i+')">Verificar</button><button class="btn" onclick="$(\'dlg\').close()">Cancelar</button></div>')}
function doVerSkill(i){var m=parseInt($('f1').value);if(!(m>=3))return toast('Necesitas al menos 3 meses de práctica');stu().skills[i].v=1;save();$('dlg').close();render();toast('Habilidad verificada')}
function addCert(){dlg('<h2>Agregar certificado</h2><label>Nombre</label><input id="f1"><label>Institución</label><input id="f2"><div class="row" style="margin-top:18px"><button class="btn p" onclick="saveCert()">Guardar</button><button class="btn" onclick="$(\'dlg\').close()">Cancelar</button></div>')}
function saveCert(){var n=$('f1').value.trim(),o=$('f2').value.trim();if(!n||!o)return toast('Completa los dos campos');stu().certs.push({n:n,o:o,v:0});save();$('dlg').close();render();toast('Certificado agregado')}
function delCert(i){stu().certs.splice(i,1);save();render()}
function verCert(i){var c=stu().certs[i];dlg('<h2>Verificar certificado</h2><p class="mute">'+esc(c.n)+' · '+esc(c.o)+'</p><label>Código de verificación del certificado</label><input id="f1" placeholder="Mínimo 6 caracteres"><div class="row" style="margin-top:18px"><button class="btn p" onclick="doVerCert('+i+')">Verificar</button><button class="btn" onclick="$(\'dlg\').close()">Cancelar</button></div>')}
function doVerCert(i){if($('f1').value.trim().length<6)return toast('El código debe tener al menos 6 caracteres');stu().certs[i].v=1;save();$('dlg').close();render();toast('Certificado verificado')}
function companyView(){var q=F.q.toLowerCase(),list=D.students.filter(function(s){if(F.career&&s.career!==F.career)return false;if(!q)return true;return s.skills.some(function(k){return k.n.toLowerCase().indexOf(q)>-1})||s.certs.some(function(c){return c.n.toLowerCase().indexOf(q)>-1})});
var careers=[];D.students.forEach(function(s){if(careers.indexOf(s.career)<0)careers.push(s.career)});
var h='<h2>Talento disponible</h2><p class="mute">Perfiles anónimos hasta que el estudiante acepte tu solicitud: solo ves estudios, habilidades y certificados.</p><div class="bar"><input id="q" placeholder="Buscar habilidad o certificado" value="'+esc(F.q)+'" oninput="F.q=this.value;list_()"><select onchange="F.career=this.value;render()"><option value="">Todas las carreras</option>'+careerOpts(F.career)+'</select><select onchange="F.lv=this.value;companyRender()"><option value="">Todos los niveles</option><option value="g"'+(F.lv==='g'?' selected':'')+'>Egresados</option><option value="e"'+(F.lv==='e'?' selected':'')+'>Estudiantes</option></select><button class="btn" onclick="F.sv=!F.sv;companyRender()">'+(F.sv?'Ver todos':'★ Ver guardados')+'</button></div><div id="res"></div>';return h}
function list_(){var el=$('res');if(!el){return}var p=$('q');var pos=p.selectionStart;var a=$('app');companyRender();}
function companyRender(){var f=$('q');var keep=f===document.activeElement;var pos=f?f.selectionStart:0;$('app').innerHTML=companyView();if(keep){var n=$('q');n.focus();n.setSelectionRange(pos,pos)}fill()}
function fill(){var q=F.q.toLowerCase(),res=$('res');if(!res)return;var list=D.students.filter(function(s){if(F.career&&s.career!==F.career)return false;if(F.sv&&!isSaved(s.id))return false;if(F.lv&&((s.level||'').indexOf('Egresado')===0)!==(F.lv==='g'))return false;if(!q)return true;return s.skills.some(function(k){return k.n.toLowerCase().indexOf(q)>-1})||s.certs.some(function(c){return c.n.toLowerCase().indexOf(q)>-1})});

return h+'</div>'}

function startExam(cr){var c=examOf(cr),qs=examQs(c).map(x=>({q:x.q,a:x.a,sc:x.sc,o:x.o.map((t,j)=>({t:t,r:j===0})).sort(()=>Math.random()-.5)}));EX={sid:me.id,cr:cr,start:Date.now(),min:examMin(c),qs:qs,ans:qs.map(()=>-1),flag:qs.map(()=>0),cur:0};D.ex=D.ex||{};D.ex[me.id]=EX;save();$('dlg').close();view='exam';render()}

function pick(j){EX.ans[EX.cur]=j;save();paint()}
function stepQ(d){EX.cur+=d;save();paint(1)}
function goQ(i){EX.cur=i;save();paint(1)}
function flagQ(){EX.flag[EX.cur]=EX.flag[EX.cur]?0:1;save();paint()}
function confirmEnd(){var u=EX.ans.filter(v=>v<0).length;dlg('<h2>¿Entregar el examen?</h2><p>'+(u?'Te faltan '+u+' preguntas sin responder.':'Respondiste todas las preguntas.')+' Después de entregar no podrás cambiar tus respuestas.</p><div class="row"><button class="btn p" onclick="$(\'dlg\').close();finishExam(false)">Entregar</button><button class="btn" onclick="$(\'dlg\').close()">Seguir revisando</button></div>')}
function finishExam(auto){var s=stu(),n=EX.qs.length,ok=0,by={},wrong=[];EX.qs.forEach((q,i)=>{var b=by[q.a]=by[q.a]||{ok:0,n:0},a=EX.ans[i],c=a>=0&&q.o[a].r;b.n++;if(c){ok++;b.ok++}else wrong.push({q:q.q,t:a>=0?q.o[a].t:'Sin responder',c:q.o.filter(o=>o.r)[0].t})});
var pct=Math.round(ok/n*100),p=pct>=70;Object.keys(by).forEach(a=>{if(by[a].ok/by[a].n>=.6){var k=s.skills.find(y=>y.n===a);if(k)k.v=1;else s.skills.push({n:a,v:1})}});
if(p){s.certs=s.certs.filter(c=>c.n.indexOf('Examen de certificación · '+EX.cr)!==0);s.certs.push({n:'Examen de certificación · '+EX.cr+' ('+pct+' %)',o:'Talentry',v:1})}
delete D.ex[EX.sid];save();RES={pct:pct,p:p,ok:ok,n:n,by:by,wrong:wrong,auto:auto};EX=null;view='dash';render();showRes()}
